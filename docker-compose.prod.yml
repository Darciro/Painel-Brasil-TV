services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - pbtv

  wordpress:
    # Built and pushed by .github/workflows/deploy.yml — never built on the
    # server. Overridden per-deploy to an immutable ghcr.io/...:<sha> tag;
    # falls back to :latest for manual `docker compose up` on the server.
    image: ${WORDPRESS_IMAGE:-ghcr.io/darciro/painel-brasil-tv:latest}
    depends_on:
      - db
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_pbtv_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-0}
      PBTV_YOUTUBE_API_KEY: ${PBTV_YOUTUBE_API_KEY}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'PBTV_YOUTUBE_API_KEY', getenv( 'PBTV_YOUTUBE_API_KEY' ) ?: '' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    ports:
      - "${WP_PORT:-8080}:80"
    volumes:
      - wp_uploads:/var/www/html/wp-content/uploads
    networks:
      - pbtv

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    networks:
      - pbtv

volumes:
  db_data:
  wp_uploads:

networks:
  pbtv:
